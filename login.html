<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UNIMY SRC</title>
    <style>
        /* --- BACKGROUND IMAGE SETUP --- */
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            
            /* The Campus Image */
            background-image: url('images/meenara.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Dark Overlay so text is readable */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); /* 60% Dark overlay */
            z-index: 0;
        }

        /* --- GLASS LOGIN CARD --- */
        .login-card { 
            position: relative;
            z-index: 1; /* Sits above the overlay */
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            padding: 3rem; 
            
            /* GLASS EFFECT */
            background: rgba(255, 255, 255, 0.1); /* See-through white */
            backdrop-filter: blur(15px); /* Frosted glass blur */
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); /* Deep shadow */
            color: white;
        }

        /* Typography */
        h2 { margin-top: 0; letter-spacing: 2px; }
        .logo-red { color: #dc143c; text-shadow: 0 0 10px rgba(220, 20, 60, 0.5); }
        p { color: #ddd; margin-bottom: 2rem; }

        /* --- TOGGLE BUTTONS --- */
        .toggle-container { 
            display: flex; 
            margin-bottom: 2rem; 
            background: rgba(0, 0, 0, 0.3); /* Darker glass track */
            padding: 5px; 
            border-radius: 10px; 
        }
        .toggle-btn { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            cursor: pointer; 
            background: transparent; 
            color: #aaa;
            font-weight: bold; 
            border-radius: 8px; 
            transition: 0.3s; 
        }
        .toggle-btn.active { 
            background: #dc143c; 
            color: white; 
            box-shadow: 0 4px 10px rgba(220, 20, 60, 0.4);
        }

        /* --- INPUTS --- */
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #ccc; }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            background: rgba(255, 255, 255, 0.1); /* Glass inputs */
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 8px; 
            color: white;
            box-sizing: border-box; 
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus { border-color: #dc143c; background: rgba(0,0,0,0.2); }
        .form-group input::placeholder { color: #aaa; }

        /* --- LOGIN BUTTON --- */
        .login-btn { 
            width: 100%; 
            padding: 1rem; 
            background: #dc143c; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .login-btn:hover { background: #ff1f4f; box-shadow: 0 0 15px rgba(220, 20, 60, 0.6); }

        .error-msg { 
            background: rgba(255, 0, 0, 0.2); 
            color: #ffcccc; 
            border: 1px solid red; 
            padding: 10px; 
            border-radius: 5px; 
            margin-bottom: 1rem; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>UNIMY <span class="logo-red">SRC</span></h2>
    <p>Secure Portal Login</p>
    
    <div class="toggle-container">
        <button class="toggle-btn active" id="btn-student" onclick="setLoginType('student')">Student</button>
        <button class="toggle-btn" id="btn-staff" onclick="setLoginType('staff')">Staff Admin</button>
    </div>

    <div class="error-msg" id="error-msg">❌ Invalid Credentials</div>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label id="label-id">Student ID</label>
            <input type="text" id="userid" placeholder="Enter ID" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Access Portal</button>
    </form>
</div>

<script>
    // 1. Set Default Login Type
    let currentType = 'student';

    // 2. Function to Switch Toggle Buttons
    function setLoginType(type) {
        currentType = type;
        document.getElementById('btn-student').className = type === 'student' ? 'toggle-btn active' : 'toggle-btn';
        document.getElementById('btn-staff').className = type === 'staff' ? 'toggle-btn active' : 'toggle-btn';
        document.getElementById('label-id').textContent = type === 'student' ? 'Student ID' : 'Staff ID';
        document.getElementById('error-msg').style.display = 'none'; 
    }

    // 3. Handle Login Logic
    async function handleLogin(e) {
        e.preventDefault(); // Stop page from refreshing
        
        const id = document.getElementById('userid').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('error-msg');

        // Show a loading text so you know it's working
        const btn = document.querySelector('.login-btn');
        const originalText = btn.textContent;
        btn.textContent = "Connecting...";
        btn.disabled = true;

        try {
            // === THIS IS THE IMPORTANT LINE ===
            const res = await fetch('https://src-backend-roau.onrender.com/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, password, loginType: currentType })
            });

            const data = await res.json();

            if (data.success) {
                // Login Successful! Save info.
                localStorage.setItem('currentUser', data.name);
                localStorage.setItem('userRole', data.role);
                localStorage.setItem('staffType', data.staffType || 'null'); // Save staff permissions
                window.location.href = data.redirect;
            } else {
                // Login Failed (Wrong password)
                errorMsg.textContent = ' ❌  ' + data.message;
                errorMsg.style.display = 'block';
                btn.textContent = originalText;
                btn.disabled = false;
            }
        } catch (err) {
            // Network Error (Server is down or sleeping)
            console.error(err);
            errorMsg.innerHTML = ' ❌  Server is waking up... try again in 10s.<br><small>(' + err.message + ')</small>';
            errorMsg.style.display = 'block';
            btn.textContent = originalText;
            btn.disabled = false;
        }
    }
</script>
<button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>

<script>
    // --- THEME LOGIC ---
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        document.getElementById('theme-btn').textContent = isLight ? '☀️' : '🌙';
    }
    // Load Saved Theme
    if(localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('theme-btn').textContent = '☀️';
    }
</script>
<button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
</body>
</html>
